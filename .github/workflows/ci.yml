name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint / typecheck / build
        run: npx turbo lint typecheck build --filter=web --filter=@workspace/ui
        env:
          SESSION_SECRET: ci-placeholder-secret-not-used-for-anything
