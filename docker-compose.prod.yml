services:
  backend:
    image: bhautik2004/trucart-backend:latest
    env_file:
      - .env.local
    environment:
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost}
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    image: bhautik2004/trucart-web:latest
    env_file:
      - .env.local
    ports:
      - "80:3000"
    depends_on:
      - backend
    restart: unless-stopped
